<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ Bac Bank - بنك تمارين البكالوريا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="text-3xl">📚</span>
                <div>
                    <h1 class="text-2xl font-black tracking-wider">DZ Bac Bank</h1>
                    <p class="text-xs text-indigo-200">بنك تمارين البكالوريا - الجزائر</p>
                </div>
            </div>
            <div>
                <button onclick="openAdminModal()" class="bg-indigo-600 hover:bg-indigo-800 border border-indigo-400 text-white px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2">
                    <span>⚙️</span> لوحة الإدارة
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        
        <!-- Filters Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2">الشعبة الدراسية</label>
                <select id="streamFilter" onchange="onStreamChange(); filterExercises();" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="علوم تجريبية">علوم تجريبية</option>
                    <option value="رياضيات">رياضيات</option>
                    <option value="تقني رياضي">تقني رياضي</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2">المادة</label>
                <select id="subjectFilter" onchange="updateUnits(); filterExercises();" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="الفيزياء">الفيزياء</option>
                    <option value="الرياضيات">الرياضيات</option>
                    <option value="العلوم الطبيعية">العلوم الطبيعية</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2">الوحدة التعليمية</label>
                <select id="unitFilter" onchange="filterExercises()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">جميع الوحدات</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2">السنة</label>
                <select id="yearFilter" onchange="filterExercises()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">كل السنوات (2009 - 2026)</option>
                </select>
            </div>
        </div>

        <!-- Exercises List Container -->
        <div id="exercisesContainer" class="grid grid-cols-1 gap-6">
            <!-- Dynamic content loaded via JS -->
        </div>
    </main>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-4 text-slate-800">تسجيل دخول المشرف</h3>
            <div id="adminLoginSection">
                <p class="text-sm text-slate-500 mb-4">أدخل كلمة مرور المشرف لإضافة تمارين جديدة:</p>
                <input type="password" id="adminPassInput" placeholder="كلمة المرور..." class="w-full border border-slate-300 rounded-xl px-3 py-2 mb-4 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="flex justify-end gap-2">
                    <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-bold">إلغاء</button>
                    <button onclick="verifyAdmin()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold">دخول</button>
                </div>
            </div>
            <div id="adminPanelSection" class="hidden">
                <h4 class="text-md font-bold text-indigo-600 mb-4">إضافة تمرين جديد</h4>
                <form id="addExerciseForm" onsubmit="handleAddExercise(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">عنوان التمرين</label>
                        <input type="text" id="exTitle" required class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">الشعبة</label>
                        <select id="exStream" onchange="updateModalUnits()" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
                            <option value="علوم تجريبية">علوم تجريبية</option>
                            <option value="رياضيات">رياضيات</option>
                            <option value="تقني رياضي">تقني رياضي</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">المادة</label>
                        <select id="exSubject" onchange="updateModalUnits()" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
                            <option value="الفيزياء">الفيزياء</option>
                            <option value="الرياضيات">الرياضيات</option>
                            <option value="العلوم الطبيعية">العلوم الطبيعية</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">الوحدة</label>
                        <select id="exUnit" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">السنة</label>
                        <input type="number" id="exYear" min="2009" max="2026" value="2024" required class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">رابط ملف PDF التمرين (أو صورة)</label>
                        <input type="url" id="exPdf" placeholder="https://..." required class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">رابط ملف PDF الحل النموذجي (أو صورة)</label>
                        <input type="url" id="exSol" placeholder="https://..." required class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none">
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-bold">إغلاق</button>
                        <button type="submit" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl text-sm font-bold">حفظ ونشر</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
        DZ Bac Bank &copy; 2026 - جميع الحقوق محفوظة لطلبة البكالوريا
    </footer>

    <script>
        const curriculum = {
            "الفيزياء": [
                "1. المتابعة الزمنية لتحول كيميائي",
                "2. تطور جملة ميكانيكية",
                "3. دراسة ظواهر كهربائية",
                "4. تطور جملة كيميائية نحو حالة التوازن",
                "5. التحولات النووية",
                "6. مراقبة تطور جملة كيميائية",
                "7. التطورات المهتزة",
                "8. مفهوم الموجة"
            ],
            "الرياضيات": [
                "الدوال العدديـة والأسية واللوغاريتمية",
                "المتتاليات العددية",
                "الأعداد والحساب",
                "الأعداد المركبة",
                "الدوال الأصلية والحساب التكاملي",
                "الاحتمالات",
                "الهندسة في الفضاء"
            ],
            "العلوم الطبيعية": [
                "المجال 1 - الوحدة 1: تركيب البروتين",
                "المجال 1 - الوحدة 2: العلاقة بين بنية وتخصص البروتين",
                "المجال 1 - الوحدة 3: النشاط الإنزيمي للبروتينات",
                "المجال 1 - الوحدة 4: التخصص الوظيفي في الدفاع عن الذات (المناعة)",
                "المجال 1 - الوحدة 5: التخصص الوظيفي في الاتصال العصبي",
                "المجال 2 - الوحدة 1: تحويل الطاقة الضوئية إلى طاقة كيميائية كامنة",
                "المجال 2 - الوحدة 2: تحويل الطاقة الكيميائية إلى ATP",
                "المجال 3 - الوحدة 1: بنية الكرة الأرضية والنشاط التكتوني"
            ]
        };

        let exercises = JSON.parse(localStorage.getItem('dz_bac_exercises')) || [];

        function populateYears() {
            const yearFilter = document.getElementById('yearFilter');
            for (let y = 2026; y >= 2009; y--) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearFilter.appendChild(opt);
            }
        }

        function onStreamChange() {
            updateUnits();
        }

        function updateUnits() {
            const subject = document.getElementById('subjectFilter').value;
            const stream = document.getElementById('streamFilter').value;
            const unitFilter = document.getElementById('unitFilter');
            
            unitFilter.innerHTML = '<option value="">جميع الوحدات</option>';
            
            let units = curriculum[subject] || [];
            units.forEach(u => {
                if (u === "الأعداد والحساب" && stream === "علوم تجريبية") {
                    return; // Hide Arithmetics from Experimental Sciences
                }
                let opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                unitFilter.appendChild(opt);
            });
        }

        function updateModalUnits() {
            const subject = document.getElementById('exSubject').value;
            const stream = document.getElementById('exStream').value;
            const exUnit = document.getElementById('exUnit');
            
            exUnit.innerHTML = '';
            let units = curriculum[subject] || [];
            units.forEach(u => {
                if (u === "الأعداد والحساب" && stream === "علوم تجريبية") {
                    return;
                }
                let opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                exUnit.appendChild(opt);
            });
        }

        function filterExercises() {
            const stream = document.getElementById('streamFilter').value;
            const subject = document.getElementById('subjectFilter').value;
            const unit = document.getElementById('unitFilter').value;
            const year = document.getElementById('yearFilter').value;

            const container = document.getElementById('exercisesContainer');
            container.innerHTML = '';

            let filtered = exercises.filter(ex => {
                if (ex.stream !== stream && ex.stream !== 'الكل') return false;
                if (ex.subject !== subject) return false;
                if (unit && ex.unit !== unit) return false;
                if (year && ex.year != year) return false;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
                        <p class="text-slate-400 text-sm">لا توجد تمارين مطابقة لهذه الفلاتر حالياً.</p>
                    </div>`;
                return;
            }

            filtered.forEach((ex, idx) => {
                container.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <span class="inline-block bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-md font-bold mb-2">${ex.unit}</span>
                            <h3 class="text-lg font-bold text-slate-800">${ex.title}</h3>
                            <p class="text-xs text-slate-400 mt-1">السنة: ${ex.year} | الشعبة: ${ex.stream}</p>
                        </div>
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            <a href="${ex.pdf}" target="_blank" class="flex-1 md:flex-none text-center bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">📄 عرض التمرين (PDF/صورة)</a>
                            <a href="${ex.solution}" target="_blank" class="flex-1 md:flex-none text-center bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">✅ الحل النموذجي</a>
                        </div>
                    </div>`;
            });
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
            document.getElementById('adminPassInput').value = '';
            document.getElementById('adminLoginSection').classList.remove('hidden');
            document.getElementById('adminPanelSection').classList.add('hidden');
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === 'ggbruh999') {
                document.getElementById('adminLoginSection').classList.add('hidden');
                document.getElementById('adminPanelSection').classList.remove('hidden');
                updateModalUnits();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function handleAddExercise(e) {
            e.preventDefault();
            const newEx = {
                title: document.getElementById('exTitle').value,
                stream: document.getElementById('exStream').value,
                subject: document.getElementById('exSubject').value,
                unit: document.getElementById('exUnit').value,
                year: document.getElementById('exYear').value,
                pdf: document.getElementById('exPdf').value,
                solution: document.getElementById('exSol').value
            };

            exercises.push(newEx);
            localStorage.setItem('dz_bac_exercises', JSON.stringify(exercises));
            alert('تمت إضافة التمرين بنجاح!');
            document.getElementById('addExerciseForm').reset();
            closeAdminModal();
            filterExercises();
        }

        // Initialize page
        populateYears();
        updateUnits();
        filterExercises();
    </script>
</body>
</html>
